name: Simple CI/CD Pipeline

# When to run this workflow
on:
  push:
    branches: [ main ]

jobs:
  # Job 1: Run basic tests
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install backend dependencies
        run: |
          cd backend
          pip install -r requirements.txt
      
      - name: Test backend imports
        run: |
          cd backend
          python -c "from app.main import app; print('✅ Backend imports work!')"
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci
      
      - name: Lint frontend
        run: |
          cd frontend
          npm run lint

  # Job 2: Deploy to EC2
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: test  # Only deploy if tests pass
    
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.AWS_EC2_IP }} >> ~/.ssh/known_hosts
      
      - name: Deploy to server
        run: |
          ssh -i ~/.ssh/deploy_key ubuntu@${{ secrets.AWS_EC2_IP }} << 'EOF'
            # Go to project directory
            cd ~/MarketSight || { echo "Project folder not found!"; exit 1; }
            
            # Pull latest code from GitHub
            echo "📥 Pulling latest code..."
            git pull origin main
            
            # Rebuild and restart containers
            echo "🔨 Rebuilding containers..."
            docker compose -f deploy/docker-compose.prod.yml down
            docker compose -f deploy/docker-compose.prod.yml up -d --build
            
            # Clean up old images
            docker image prune -af
            
            echo "✅ Deployment complete!"
            echo ""
            echo "Running containers:"
            docker ps --format "table {{.Names}}\t{{.Status}}"
          EOF
